services:
  # CodeIgniter 4 Kassensystem
  kassensystem-web:
    build: .
    container_name: kassensystem-vdst-web
    ports:
      - "8080:80"
    depends_on:
      - kassensystem-db
    volumes:
      - ./:/var/www/html/:cached
      - ./writable:/var/www/html/writable:delegated
      - kassensystem_vendor:/var/www/html/vendor
    environment:
      - DB_HOST=kassensystem-db
      - DB_NAME=vdst_kassensystem_small
      - DB_USER=kassenuser
      - DB_PASS=${DB_PASS:-kassenpass123}
      - CI_ENVIRONMENT=${CI_ENVIRONMENT:-development}
      - app.baseURL=${APP_BASEURL:-http://localhost:8080/}
    networks:
      - kassensystem-network

  # MySQL Datenbank
  kassensystem-db:
    image: mysql:8.0
    container_name: kassensystem-vdst-db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass123}
      MYSQL_DATABASE: vdst_kassensystem_small
      MYSQL_USER: kassenuser
      MYSQL_PASSWORD: ${DB_PASS:-kassenpass123}
    # Benötigt für die Trigger in der Seed-Migration (werden von einer
    # späteren Migration wieder entfernt)
    command: --log-bin-trust-function-creators=1
    # MySQL ist nur im Docker-Netzwerk erreichbar (phpMyAdmin auf Port 8081)
    volumes:
      - kassensystem_mysql_data:/var/lib/mysql
    networks:
      - kassensystem-network

  # phpMyAdmin für Datenbank-Management
  kassensystem-phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: kassensystem-vdst-phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: kassensystem-db
      PMA_PORT: 3306
      PMA_USER: kassenuser
      PMA_PASSWORD: ${DB_PASS:-kassenpass123}
    depends_on:
      - kassensystem-db
    networks:
      - kassensystem-network

volumes:
  kassensystem_mysql_data:
  kassensystem_vendor:

networks:
  kassensystem-network:
    driver: bridge
